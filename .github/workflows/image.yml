# Build, smoke-test, publish and sign the server image: ghcr.io/flayrlabs/skwod-server.
#
#   Release:    git tag skwod-v45 <merged commit on main> && git push origin skwod-v45
#   Re-run:     gh workflow run image.yml -R FlayrLabs/skwod --ref skwod-v45
#               (by hand, but still ON the tag: the signature names the tag it was built from)
#
# What it does
#   1. build (one job per architecture, each on a NATIVE runner — no QEMU): builds the image
#      from the Dockerfile with SBOM + provenance attestations, then runs
#      deploy/smoke-test-image.sh against it (healthy, one-time admin token in the log, the
#      Unraid template's privilege drop, livekit-server running). Nothing is pushed here; the
#      tested archive itself is what leaves the job.
#   2. publish (only after both architectures passed): pushes exactly those tested archives,
#      (as `<build>-amd64` / `<build>-arm64`), merges them into one multi-arch image tagged
#      `<build>`, signs its digest with cosign keyless (GitHub OIDC → Fulcio, logged in Rekor),
#      checks the signature with deploy/verify-image.sh — the same check hosts run — and only
#      then points `latest` at it.
#
# Rules for this file (CODEOWNERS covers .github/, so changes here get the maintainer's review):
#   - Never triggered by pull_request or pull_request_target: fork code never reaches this.
#   - Runs only in FlayrLabs/skwod and only on a `skwod-v<n>` tag (push, or dispatch with
#     --ref skwod-v<n>). deploy/image-release-guard.sh refuses unless <n> equals
#     CURRENT_PROJECT_VERSION in apps/apple/project.yml at that commit AND the tagged commit is
#     on main (merged through a reviewed pull request). A ruleset limits who may create the tags.
#   - Workflow default is `contents: read`. `packages: write` and `id-token: write` exist on the
#     publish job only, which runs behind the `release` environment (a maintainer approves each
#     run) and runs no code from the build beyond the tested archives and the guard scripts.
#   - `latest` only moves forward: the publish job refuses a build that is not strictly newer
#     than the one `latest` carries (org.opencontainers.image.version), and an already
#     published `<n>` is never overwritten. One global concurrency group serializes publishing.
#   - No `secrets.*` other than the automatic GITHUB_TOKEN. Actions are pinned to commit SHAs.
#   - Release builds use no build cache: every layer is built from source in this run.
name: image

on:
  push:
    tags: ['skwod-v*']
  workflow_dispatch:   # only does anything when run on a skwod-v<n> tag (--ref skwod-v<n>)

permissions:
  contents: read

concurrency:
  group: image-publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/flayrlabs/skwod-server

jobs:
  build:
    name: build (${{ matrix.arch }})
    if: github.repository == 'FlayrLabs/skwod' && startsWith(github.ref, 'refs/tags/skwod-v')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    outputs:
      build: ${{ steps.build.outputs.number }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0   # the whole history, to check the tagged commit is on main

      - name: Release guard (tag = build number in the source, tagged commit is on main)
        id: build
        env:
          REF_NAME: ${{ github.ref_name }}
          PUSH_GATEWAY: ${{ vars.SKWOD_DEFAULT_PUSH_GATEWAY }}
        run: |
          deploy/test-image-release-guard.sh >/dev/null
          n="$(deploy/image-release-guard.sh build-number "$REF_NAME" apps/apple/project.yml)"
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          deploy/image-release-guard.sh on-main "$GITHUB_SHA" origin/main
          echo "number=$n" >> "$GITHUB_OUTPUT"
          [ -n "$PUSH_GATEWAY" ] || echo "::warning::repository variable SKWOD_DEFAULT_PUSH_GATEWAY is empty: the image has no built-in push gateway (the owner's app decides; docs/PUSH.md)"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The image that will be published: an OCI archive with its SBOM and provenance attached.
      - name: Build (OCI archive with SBOM + provenance)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          no-cache: true
          pull: true
          provenance: mode=max
          sbom: true
          build-args: |
            SKWOD_DEFAULT_PUSH_GATEWAY=${{ vars.SKWOD_DEFAULT_PUSH_GATEWAY }}
          labels: |
            org.opencontainers.image.title=skwod-server
            org.opencontainers.image.description=Skwod server: end-to-end encrypted, self-hosted group chat (with LiveKit for calls)
            org.opencontainers.image.source=https://github.com/FlayrLabs/skwod
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ steps.build.outputs.number }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=oci,dest=${{ runner.temp }}/skwod-server-${{ matrix.arch }}.tar

      # Test the very archive that will be published: copy it into the runner's Docker (skopeo
      # picks this runner's platform out of the index) instead of building a second time.
      - name: Load the archive for the smoke test
        env:
          TAR: ${{ runner.temp }}/skwod-server-${{ matrix.arch }}.tar
        run: |
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          skopeo copy "oci-archive:$TAR" docker-daemon:skwod-server:smoke
          docker image inspect -f '{{.Os}}/{{.Architecture}} {{.Id}}' skwod-server:smoke

      - name: Smoke test (healthy, admin token, privilege drop, LiveKit running)
        run: deploy/smoke-test-image.sh skwod-server:smoke

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skwod-server-${{ matrix.arch }}
          path: ${{ runner.temp }}/skwod-server-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # A maintainer approves each publish (Settings → Environments → release → Required
    # reviewers; docs/GOING-PUBLIC.md). Without that setting the environment only names the run.
    environment: release
    permissions:
      contents: read
      packages: write   # push to ghcr.io/flayrlabs/skwod-server
      id-token: write   # cosign keyless: the OIDC token Fulcio certifies
    env:
      BUILD: ${{ needs.build.outputs.build }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: skwod-server-*
          path: ${{ runner.temp }}/images
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Before anything is pushed: never overwrite a published build, never move latest back.
      - name: Publish guard (build is new, and newer than latest)
        run: |
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          if ! tags="$(skopeo list-tags --authfile "$HOME/.docker/config.json" "docker://$IMAGE" 2>"$RUNNER_TEMP/err")"; then
            grep -qiE 'name unknown|not found|404' "$RUNNER_TEMP/err" || { cat "$RUNNER_TEMP/err" >&2; exit 1; }
            tags='{"Tags":[]}'   # first publish: the package does not exist yet
          fi
          if jq -e --arg t "$BUILD" '.Tags | index($t)' <<<"$tags" >/dev/null; then
            echo "::error::$IMAGE:$BUILD is already published; builds are never overwritten"; exit 1
          fi
          current=""
          if jq -e '.Tags | index("latest")' <<<"$tags" >/dev/null; then
            current="$(skopeo inspect --authfile "$HOME/.docker/config.json" --override-os linux --override-arch amd64 \
              "docker://$IMAGE:latest" | jq -r '.Labels["org.opencontainers.image.version"] // ""')"
          fi
          deploy/image-release-guard.sh newer "$BUILD" "$current"

      # --all keeps the attestation manifests; --preserve-digests refuses to push anything but
      # the exact tested bytes.
      - name: Push the tested images (per architecture)
        env:
          DIR: ${{ runner.temp }}/images
        run: |
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          for arch in amd64 arm64; do
            skopeo copy --all --preserve-digests --retry-times 3 \
              --authfile "$HOME/.docker/config.json" \
              --digestfile "$DIR/$arch.digest" \
              "oci-archive:$DIR/skwod-server-$arch.tar" "docker://$IMAGE:$BUILD-$arch"
            echo "$arch: $IMAGE@$(cat "$DIR/$arch.digest")"
          done

      # `latest` moves only after the merged image is signed and the signature verified, so a
      # failed signing never leaves an unsigned `latest` behind.
      - name: Merge into one multi-arch image, tagged ${{ env.BUILD }}
        id: merge
        env:
          DIR: ${{ runner.temp }}/images
        run: |
          docker buildx imagetools create -t "$IMAGE:$BUILD" \
            "$IMAGE@$(cat "$DIR/amd64.digest")" "$IMAGE@$(cat "$DIR/arm64.digest")"
          digest="$(docker buildx imagetools inspect "$IMAGE:$BUILD" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::could not read the merged digest"; exit 1; }
          docker buildx imagetools inspect "$IMAGE@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign (cosign keyless)
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Verify the way hosts do (deploy/verify-image.sh)
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: deploy/verify-image.sh "$IMAGE@$DIGEST"

      - name: Move latest to the signed image (re-checked, forward only)
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          current=""
          if skopeo inspect --authfile "$HOME/.docker/config.json" --override-os linux --override-arch amd64 \
               "docker://$IMAGE:latest" >"$RUNNER_TEMP/latest.json" 2>/dev/null; then
            current="$(jq -r '.Labels["org.opencontainers.image.version"] // ""' "$RUNNER_TEMP/latest.json")"
          fi
          deploy/image-release-guard.sh newer "$BUILD" "$current"
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE@$DIGEST"

      - name: Summary
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          {
            echo "## skwod-server build $BUILD"
            echo
            echo "Tags: \`$IMAGE:$BUILD\`, \`$IMAGE:latest\` (linux/amd64, linux/arm64)"
            echo
            echo "Digest (put this in the release notes):"
            echo
            echo "    $IMAGE@$DIGEST"
            echo
            echo "Verify: \`deploy/verify-image.sh $IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
