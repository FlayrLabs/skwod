[package]
name = "skwod-host"
description = "Tray app for hosting a skwod server on a Windows or Linux PC: runs the bundled server, opens its admin page, Start/Stop/Quit."
version = "0.48.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.93.1"
publish = false

[dependencies]
serde_json = "1"
# The server proves it holds the launch key (HMAC over our nonce) before we send it anything.
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.3"   # the nonce, and the name of the browser hand-off file
# Clean shutdown of the server child on Ctrl-C / SIGTERM (headless mode, session logout).
ctrlc = { version = "3", features = ["termination"] }

# The tray. Everything else is std: the app only supervises a child process and talks HTTP to
# its loopback admin page.
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }
tao = { version = "0.37", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# The GTK 3 AppIndicator tray (works on GNOME with the AppIndicator extension, KDE, XFCE, …).
tray-icon = { version = "0.26", default-features = false, features = ["libappindicator"] }
gtk = "0.18"   # the first-run note (same GTK the tray already links)

[target.'cfg(windows)'.dependencies]
winreg = "0.56"   # opt-in "launch at login": HKCU\…\Run
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
panic = "abort"
