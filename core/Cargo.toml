# SkwodCore — shared Rust workspace (crypto + sync + UniFFI bindings).
# See ../docs/ARCHITECTURE.md §4.
[workspace]
resolver = "3"
members = [
    "skwod-crypto",
    "skwod-sync",
    "skwod-core",
    "skwod-net",
]
# Third-party source kept here (see vendor/verify.sh), not ours.
exclude = ["vendor"]

[workspace.package]
version = "0.51.0"
edition = "2021"
license = "AGPL-3.0-only"     # ADR-011 (supersedes ADR-002): we link libsignal
rust-version = "1.93.1"     # libsignal v0.108.0 MSRV

[workspace.lints.rust]
unsafe_code = "forbid"        # crypto core stays safe-Rust; FFI unsafe is isolated to the bindings crate

# Argon2id at backup-grade cost is unusably slow unoptimized; optimize just that crate (and the
# KEM) in dev/test builds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.libcrux-ml-kem]
opt-level = 3
# Proof-of-work stamps (skwod-net `pow.rs`) are ~1M SHA-256 per signup/login; unoptimized that
# takes seconds and makes tests crawl. Optimize just the hashing path in dev/test builds.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.skwod-net]
opt-level = 3

# The published 0.7.2 plus vendor/n0-mainline-0.7.2.patch: a DHT socket that iOS took away (or that
# dies in any other way) made its task spin for ever and kept the only thread of the apps' runtime.
[patch.crates-io]
n0-mainline = { path = "vendor/n0-mainline" }
