[package]
name = "skwod-net"
description = "Peer-to-peer transport for skwod: the host is addressed by its key (iroh), discovered via the Mainline DHT, and the existing HTTP/WS API + LiveKit ride over one QUIC connection."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.91"   # iroh's MSRV

[lints]
workspace = true

[dependencies]
# PINNED (exact). The wire/relay protocol and the pkarr record format are iroh's — bump deliberately,
# re-run the p2p tests and the headless demo (docs/P2P.md) when you do.
iroh = { version = "=1.4.1", default-features = false, features = ["portmapper", "tls-ring", "fast-apple-datapath"] }
iroh-mainline-address-lookup = "=0.6.1"
# LAN discovery (lan.rs) speaks mDNS through this directly, so the announced name can be a
# rotating keyed tag instead of the node id (which iroh's own mDNS lookup would announce).
swarm-discovery = "=0.6.6"
hmac = "0.12"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "io-util"] }
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"   # proof-of-work stamps for unauthenticated first contact
serde_json = "1"
thiserror = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }   # the stream of a wrapped address lookup
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
tempfile = "3"
base64 = "0.22"
serde_json = "1"
