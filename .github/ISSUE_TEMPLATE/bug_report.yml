name: Bug report
description: Something in Skwod doesn't work as it should. NOT for security problems; see SECURITY.md.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security problem?** Don't file it here. E-mail security@skwod.io or use *Report a vulnerability* under the Security tab.

        Leave out anything private: no invite links, node ids, server addresses, names, message text or screenshots of real chats.
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      multiple: true
      options: [iPhone app, Mac app, Android app, Server, Host tray app (Windows/Linux), Push notifications, Website, Other]
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build number and OS
      description: Settings → About in the app shows the build. For example, "build 45, iOS 26.1".
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: Remove ids, addresses and names first.
      render: text
